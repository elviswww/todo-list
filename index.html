<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡任務管理 | To-Do List</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    /* 自訂細緻滾動條 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* 任務完成劃線與淡化過渡 */
    .task-enter {
      animation: fadeInSlide 0.25s ease-out forwards;
    }
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-indigo-500 selection:text-white pb-16">

  <div class="max-w-4xl mx-auto px-4 sm:px-6 pt-10">
    <!-- 本機儲存受限警告條 (預設隱藏，僅在沙盒或受限環境時觸發顯示) -->
    <div id="storageWarningBanner" class="hidden mb-6 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-sm flex items-start gap-3 shadow-sm">
      <svg class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <div class="flex-1">
        <p class="font-semibold">注意：目前預覽環境限制了瀏覽器本機儲存 (localStorage)</p>
        <p class="text-xs text-amber-700 mt-1 leading-relaxed">
          由於線上預覽沙盒或無痕模式的安全性隔離，重新整理可能無法永久保存資料。建議您點擊右上方<strong>「匯出備份」</strong>保存檔案，或將此網頁下載至本機後透過瀏覽器正常開啟使用。
        </p>
      </div>
    </div>

    <!-- Header 頂部標題區 -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">任務待辦清單</h1>
            <p id="currentDateText" class="text-sm text-slate-500"></p>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 備份與匯入按鈕 -->
        <div class="flex items-center gap-1.5 bg-white p-1.5 rounded-2xl border border-slate-200/80 shadow-sm">
          <button id="exportBtn" title="匯出備份 (JSON)" class="px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            <span class="hidden sm:inline">匯出</span>
          </button>
          <button id="importBtn" title="匯入備份 (JSON)" class="px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            <span class="hidden sm:inline">匯入</span>
          </button>
          <input type="file" id="importFileInput" accept=".json" class="hidden">
        </div>

        <!-- 統計數據徽章 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex items-center gap-6">
          <div>
            <div class="text-xs font-medium text-slate-400">完成進度</div>
            <div class="text-xl font-bold text-slate-800 flex items-baseline gap-1">
              <span id="statPercent">0%</span>
              <span class="text-xs font-normal text-slate-400">(<span id="statCompleted">0</span>/<span id="statTotal">0</span>)</span>
            </div>
          </div>
          <div class="w-16 h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="statProgressBar" class="h-full bg-indigo-600 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 新增任務表單卡片 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 mb-8">
      <form id="todoForm" class="space-y-4">
        <!-- 任務標題輸入 -->
        <div>
          <input 
            type="text" 
            id="taskInput" 
            placeholder="今天想要完成什麼任務？（按下 Enter 即可儲存）"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-base"
            required
            autocomplete="off"
          >
        </div>

        <!-- 任務選項欄位 (分類、優先級、截止日) -->
        <div class="flex flex-wrap items-center gap-3 pt-1">
          <!-- 分類選擇 -->
          <div class="flex items-center gap-2 text-sm">
            <label for="categorySelect" class="text-slate-500 text-xs font-semibold uppercase tracking-wider">分類</label>
            <select id="categorySelect" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="work">💼 工作</option>
              <option value="personal">🏠 生活</option>
              <option value="study">📚 學習</option>
              <option value="health">🏃‍♂️ 健康</option>
            </select>
          </div>

          <!-- 優先級選擇 -->
          <div class="flex items-center gap-2 text-sm">
            <label for="prioritySelect" class="text-slate-500 text-xs font-semibold uppercase tracking-wider">優先級</label>
            <select id="prioritySelect" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="medium">🟡 中等</option>
              <option value="high">🔴 重要緊急</option>
              <option value="low">🟢 輕鬆日常</option>
            </select>
          </div>

          <!-- 到期日選擇 -->
          <div class="flex items-center gap-2 text-sm">
            <label for="dueDateInput" class="text-slate-500 text-xs font-semibold uppercase tracking-wider">截止日</label>
            <input type="date" id="dueDateInput" class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <!-- 新增按鈕 -->
          <div class="ml-auto w-full sm:w-auto mt-2 sm:mt-0">
            <button 
              type="submit" 
              class="w-full sm:w-auto px-5 py-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-xl text-sm transition shadow-sm shadow-indigo-100 flex items-center justify-center gap-1.5"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              <span>新增任務</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- 篩選與工具列 -->
    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-5">
      <!-- 狀態按鈕群 (全部 / 待辦 / 已完成) -->
      <div class="inline-flex p-1 bg-slate-200/70 rounded-xl max-w-full overflow-x-auto">
        <button data-filter="all" class="filter-tab px-4 py-1.5 text-sm font-medium rounded-lg transition bg-white text-slate-900 shadow-sm">
          全部 (<span id="countAll">0</span>)
        </button>
        <button data-filter="active" class="filter-tab px-4 py-1.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900">
          進行中 (<span id="countActive">0</span>)
        </button>
        <button data-filter="completed" class="filter-tab px-4 py-1.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900">
          已完成 (<span id="countCompleted">0</span>)
        </button>
      </div>

      <!-- 快速搜尋與分類過濾 -->
      <div class="flex items-center gap-2">
        <div class="relative flex-1 sm:w-52">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜尋任務關鍵字..." 
            class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 placeholder-slate-400"
          >
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <select id="filterCategory" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">所有分類</option>
          <option value="work">💼 工作</option>
          <option value="personal">🏠 生活</option>
          <option value="study">📚 學習</option>
          <option value="health">🏃‍♂️ 健康</option>
        </select>
      </div>
    </div>

    <!-- 待辦清單列表容器 -->
    <div class="space-y-2.5" id="taskList">
      <!-- 任務節點會由 JavaScript 動態生成注入 -->
    </div>

    <!-- 清空或操作輔助區 -->
    <div id="listFooter" class="mt-6 pt-4 border-t border-slate-200/80 flex items-center justify-between text-xs text-slate-400">
      <span id="summaryText">目前共有 0 個項目</span>
      <button 
        id="clearCompletedBtn" 
        class="text-rose-500 hover:text-rose-700 font-medium transition hover:underline disabled:opacity-30 disabled:pointer-events-none"
        disabled
      >
        清除所有已完成
      </button>
    </div>
  </div>

  <!-- 編輯任務 Modal -->
  <div id="editModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 transition-all scale-95 opacity-0 duration-200" id="editModalContent">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-900">編輯任務</h3>
        <button id="closeEditBtn" class="text-slate-400 hover:text-slate-600 rounded-lg p-1 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">任務名稱</label>
          <input type="text" id="editTaskTitle" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">分類</label>
            <select id="editTaskCategory" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700">
              <option value="work">💼 工作</option>
              <option value="personal">🏠 生活</option>
              <option value="study">📚 學習</option>
              <option value="health">🏃‍♂️ 健康</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">優先級</label>
            <select id="editTaskPriority" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700">
              <option value="high">🔴 重要緊急</option>
              <option value="medium">🟡 中等</option>
              <option value="low">🟢 輕鬆日常</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">截止日期</label>
          <input type="date" id="editTaskDueDate" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 text-sm rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition">取消</button>
          <button type="submit" class="px-4 py-2 text-sm rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition shadow-sm shadow-indigo-200">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 提示組件 -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    /* 核心邏輯與狀態管理 */
    const STORAGE_KEY = 'tailwind_minimal_todo_app_tasks_v2';

    let tasks = [];
    let currentFilter = 'all'; // 'all' | 'active' | 'completed'
    let currentCategory = 'all'; // 'all' | 'work' | 'personal' | 'study' | 'health'
    let searchQuery = '';
    let isStorageWorking = true;

    // DOM 元素快取
    const todoForm = document.getElementById('todoForm');
    const taskInput = document.getElementById('taskInput');
    const categorySelect = document.getElementById('categorySelect');
    const prioritySelect = document.getElementById('prioritySelect');
    const dueDateInput = document.getElementById('dueDateInput');
    const taskList = document.getElementById('taskList');
    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const currentDateText = document.getElementById('currentDateText');
    const storageWarningBanner = document.getElementById('storageWarningBanner');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');

    // 檢查 localStorage 是否可用
    function checkStorageAvailability() {
      try {
        const testKey = '__test_storage_access__';
        localStorage.setItem(testKey, testKey);
        localStorage.removeItem(testKey);
        isStorageWorking = true;
        storageWarningBanner.classList.add('hidden');
      } catch (e) {
        console.warn('localStorage 受限或無法使用:', e);
        isStorageWorking = false;
        storageWarningBanner.classList.remove('hidden');
      }
    }

    // 從 localStorage 讀取
    function loadTasks() {
      if (!isStorageWorking) {
        tasks = [];
        return;
      }

      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          // 載入使用者任務，並過濾清除任何既有的預設範例任務
          tasks = Array.isArray(parsed) 
            ? parsed.filter(t => !String(t.id).startsWith('demo-') && t.id !== '1')
            : [];
        } else {
          tasks = [];
        }
      } catch (err) {
        console.error('無法讀取本機儲存資料:', err);
        tasks = [];
      }
    }

    // 寫入 localStorage
    function saveTasks() {
      if (!isStorageWorking) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (err) {
        console.error('儲存失敗:', err);
        showToast('儲存失敗：本機儲存空間受限或權限不足', 'error');
      }
    }

    // 初始化日期標籤
    function setupDateDisplay() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateText.textContent = now.toLocaleDateString('zh-TW', options);
      
      // 預設截止日為今天
      dueDateInput.value = now.toISOString().split('T')[0];
    }

    // 標籤樣式定義對應表
    const categoryConfig = {
      work: { label: '💼 工作', bg: 'bg-blue-50 text-blue-700 border-blue-100' },
      personal: { label: '🏠 生活', bg: 'bg-emerald-50 text-emerald-700 border-emerald-100' },
      study: { label: '📚 學習', bg: 'bg-purple-50 text-purple-700 border-purple-100' },
      health: { label: '🏃‍♂️ 健康', bg: 'bg-amber-50 text-amber-700 border-amber-100' }
    };

    const priorityConfig = {
      high: { label: '重要緊急', badge: 'bg-rose-100 text-rose-700 font-medium' },
      medium: { label: '中等', badge: 'bg-amber-100 text-amber-700' },
      low: { label: '輕鬆日常', badge: 'bg-slate-100 text-slate-600' }
    };

    // 渲染任務清單
    function render() {
      // 篩選出符合條件的任務
      const filtered = tasks.filter(task => {
        // 狀態篩選
        if (currentFilter === 'active' && task.completed) return false;
        if (currentFilter === 'completed' && !task.completed) return false;

        // 分類篩選
        if (currentCategory !== 'all' && task.category !== currentCategory) return false;

        // 搜尋篩選
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          return task.title.toLowerCase().includes(q);
        }

        return true;
      });

      // 更新列表 HTML
      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200/80 text-slate-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <p class="text-sm font-medium">沒有符合條件的待辦事項</p>
            <p class="text-xs text-slate-400 mt-1">在上方輸入新項目開始規劃吧！</p>
          </div>
        `;
      } else {
        taskList.innerHTML = filtered.map(task => {
          const cat = categoryConfig[task.category] || categoryConfig.personal;
          const pri = priorityConfig[task.priority] || priorityConfig.medium;
          const isCompleted = task.completed;

          return `
            <div 
              data-id="${task.id}" 
              class="task-item group bg-white rounded-xl p-4 border border-slate-200/70 shadow-sm hover:shadow-md transition-all flex items-center justify-between gap-4 ${isCompleted ? 'bg-slate-50/70 border-slate-200/40' : ''}"
            >
              <!-- 勾選框與任務名稱 -->
              <div class="flex items-center gap-3.5 flex-1 min-w-0">
                <button 
                  type="button"
                  onclick="toggleTaskStatus('${task.id}')"
                  class="w-5 h-5 rounded-md border flex-shrink-0 flex items-center justify-center transition ${isCompleted ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 hover:border-indigo-500 bg-white'}"
                >
                  ${isCompleted ? `
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                    </svg>
                  ` : ''}
                </button>

                <div class="min-w-0 flex-1">
                  <p class="text-sm font-medium break-words transition ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">
                    ${escapeHTML(task.title)}
                  </p>
                  
                  <!-- 標籤與截止日資訊 -->
                  <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs">
                    <!-- 分類標籤 -->
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md border text-[11px] font-medium ${cat.bg}">
                      ${cat.label}
                    </span>

                    <!-- 優先級標籤 -->
                    <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] ${pri.badge}">
                      ${pri.label}
                    </span>

                    <!-- 截止日期 -->
                    ${task.dueDate ? `
                      <span class="text-slate-400 flex items-center gap-1 text-[11px]">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        ${task.dueDate}
                      </span>
                    ` : ''}
                  </div>
                </div>
              </div>

              <!-- 操作按鈕 (編輯 / 刪除) -->
              <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">
                <button 
                  onclick="openEditModal('${task.id}')" 
                  class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition"
                  title="編輯任務"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </button>
                <button 
                  onclick="deleteTask('${task.id}')" 
                  class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                  title="刪除任務"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      // 更新統計指標與數量徽章
      const total = tasks.length;
      const completedCount = tasks.filter(t => t.completed).length;
      const activeCount = total - completedCount;
      const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

      document.getElementById('statPercent').textContent = `${percent}%`;
      document.getElementById('statCompleted').textContent = completedCount;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statProgressBar').style.width = `${percent}%`;

      document.getElementById('countAll').textContent = total;
      document.getElementById('countActive').textContent = activeCount;
      document.getElementById('countCompleted').textContent = completedCount;
      document.getElementById('summaryText').textContent = `顯示中 ${filtered.length} 個項目 (共 ${total} 個)`;

      clearCompletedBtn.disabled = completedCount === 0;
    }

    // 新增任務處理
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        title: title,
        completed: false,
        category: categorySelect.value,
        priority: prioritySelect.value,
        dueDate: dueDateInput.value || null,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveTasks();
      render();

      taskInput.value = '';
      taskInput.focus();
      showToast('已新增待辦任務', 'success');
    });

    // 切換完成狀態
    window.toggleTaskStatus = function(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        render();
      }
    };

    // 刪除單一任務
    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
      showToast('任務已刪除', 'info');
    };

    // 清除已完成
    clearCompletedBtn.addEventListener('click', () => {
      const initialLength = tasks.length;
      tasks = tasks.filter(t => !t.completed);
      if (tasks.length < initialLength) {
        saveTasks();
        render();
        showToast('已清除所有已完成項目', 'info');
      }
    });

    // 開啟編輯 Modal
    window.openEditModal = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      editTaskId.value = task.id;
      editTaskTitle.value = task.title;
      editTaskCategory.value = task.category;
      editTaskPriority.value = task.priority;
      editTaskDueDate.value = task.dueDate || '';

      editModal.classList.remove('hidden');
      setTimeout(() => {
        editModalContent.classList.remove('scale-95', 'opacity-0');
        editModalContent.classList.add('scale-100', 'opacity-100');
        editTaskTitle.focus();
      }, 10);
    };

    // 關閉編輯 Modal
    function closeEditModal() {
      editModalContent.classList.remove('scale-100', 'opacity-100');
      editModalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        editModal.classList.add('hidden');
      }, 150);
    }

    closeEditBtn.addEventListener('click', closeEditModal);
    cancelEditBtn.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) closeEditModal();
    });

    // 儲存編輯
    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = editTaskId.value;
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.title = editTaskTitle.value.trim();
        task.category = editTaskCategory.value;
        task.priority = editTaskPriority.value;
        task.dueDate = editTaskDueDate.value || null;
        
        saveTasks();
        render();
        closeEditModal();
        showToast('任務已更新', 'success');
      }
    });

    // 篩選狀態按鈕點擊切換
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => {
          t.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
          t.classList.add('text-slate-600');
        });
        tab.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
        tab.classList.remove('text-slate-600');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    // 分類選單篩選
    filterCategory.addEventListener('change', (e) => {
      currentCategory = e.target.value;
      render();
    });

    // 搜尋關鍵字輸入監聽
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // 匯出 JSON 備份檔
    exportBtn.addEventListener('click', () => {
      if (tasks.length === 0) {
        showToast('目前沒有可匯出的任務項目', 'info');
        return;
      }
      try {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
        const downloadAnchor = document.createElement('a');
        const filename = `todo-backup-${new Date().toISOString().split('T')[0]}.json`;
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('備份檔案已成功匯出', 'success');
      } catch (err) {
        console.error('匯出失敗:', err);
        showToast('匯出失敗，請重試', 'error');
      }
    });

    // 觸發匯入檔案選取
    importBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    // 處理檔案匯入
    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            tasks = imported;
            saveTasks();
            render();
            showToast(`成功匯入 ${imported.length} 個任務項目`, 'success');
          } else {
            showToast('檔案格式不正確 (非有效的任務列表)', 'error');
          }
        } catch (err) {
          console.error('解析 JSON 失敗:', err);
          showToast('無法解析此 JSON 備份檔', 'error');
        }
        importFileInput.value = '';
      };
      reader.readAsText(file);
    });

    // 輕量化通知系統 (不使用原生 alert)
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-800 text-emerald-50 border-emerald-700',
        error: 'bg-rose-800 text-rose-50 border-rose-700',
        info: 'bg-slate-900 text-slate-100 border-slate-800'
      };

      toast.className = `px-4 py-2.5 rounded-xl shadow-lg border text-xs font-medium tracking-wide flex items-center gap-2 transform transition-all duration-300 opacity-0 translate-y-3 pointer-events-auto ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>${escapeHTML(message)}</span>
      `;

      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');
      });

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    // 防止 XSS 工具函數
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupDateDisplay();
      checkStorageAvailability();
      loadTasks();
      render();
    });
  </script>
</body>
</html>
